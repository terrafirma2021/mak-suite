name: Publish packages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-packages.yml"
      - "python/**"
      - "rust/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install build and test tools
        run: python -m pip install --upgrade build pytest twine "./python"

      - name: Run hardware-independent tests
        run: python -m pytest python/tests/test_response_contract.py

      - name: Build Python distributions
        working-directory: python
        run: python -m build

      - name: Verify Python distributions
        run: python -m twine check python/dist/*

      - name: Check PyPI version
        id: pypi
        working-directory: python
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          request = urllib.request.Request(
              f"https://pypi.org/pypi/makxd/{version}/json",
              headers={"User-Agent": "mak-suite-github-actions"},
          )
          try:
              with urllib.request.urlopen(request, timeout=15):
                  publish = "false"
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              publish = "true"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"publish={publish}\n")
              output.write(f"version={version}\n")
          PY

      - name: Publish Python package
        if: steps.pypi.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  rust:
    name: Rust crate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup update stable --no-self-update

      - name: Test Rust crate
        run: cargo test --manifest-path rust/Cargo.toml --all-features

      - name: Verify Rust package
        run: cargo publish --manifest-path rust/Cargo.toml --dry-run

      - name: Check crates.io version
        id: crates
        working-directory: rust
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          request = urllib.request.Request(
              f"https://crates.io/api/v1/crates/makxd/{version}",
              headers={"User-Agent": "mak-suite-github-actions"},
          )
          try:
              with urllib.request.urlopen(request, timeout=15):
                  publish = "false"
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              publish = "true"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"publish={publish}\n")
              output.write(f"version={version}\n")
          PY

      - name: Obtain crates.io publishing token
        if: steps.crates.outputs.publish == 'true'
        id: crates_io
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish Rust crate
        if: steps.crates.outputs.publish == 'true'
        run: cargo publish --manifest-path rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io.outputs.token }}
